name: build-website

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'next.config.mjs'
      - '.eslintrc.json'
      - '.github/workflows/build-website.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'next.config.mjs'
      - '.eslintrc.json'
      - '.github/workflows/build-website.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable corepack (provides pnpm via packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate build-time data snapshot
        # Required before typecheck because src/app/browse/page.tsx imports
        # src/lib/packs-snapshot.json (gitignored, regenerated each build).
        run: pnpm enrich
        continue-on-error: true

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build (static export)
        run: pnpm build

      - name: Verify static output
        run: |
          test -f out/index.html
          echo "✓ out/index.html present"
